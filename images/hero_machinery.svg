<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#051b11" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Glowing Aura behind Machinery -->
  <circle cx="560" cy="240" r="180" fill="#facc15" fill-opacity="0.12" filter="blur(30px)"/>

  <!-- Left Content Promo Text in SVG -->
  <rect x="40" y="45" width="220" height="28" rx="14" fill="#22c55e" fill-opacity="0.2" stroke="#4ade80" stroke-width="1"/>
  <text x="54" y="64" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#86efac" letter-spacing="1">TIKTOK @nnc.thanhdat2 (404K+)</text>

  <text x="40" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#ffffff">DIESEL ENGINES &amp;</text>
  <text x="40" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)">AGRI MACHINERY</text>

  <text x="40" y="210" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Genuine Kubota RT • Yanmar TF • John Deere USA</text>
  <text x="40" y="235" font-family="-apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Pre-tested runs • Secure crate packaging &amp; global freight</text>

  <!-- Spec Pills -->
  <rect x="40" y="270" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="52" y="292" font-family="sans-serif" font-size="12" font-weight="700" fill="#facc15">⚡ 1-TOUCH E-START</text>

  <rect x="195" y="270" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="207" y="292" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ade80">🛡️ 2-YEAR WARRANTY</text>

  <rect x="40" y="315" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="52" y="337" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">💧 RADIATOR COOLED</text>

  <rect x="220" y="315" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="232" y="337" font-family="sans-serif" font-size="12" font-weight="700" fill="#f43f5e">🔥 DIRECT INJECTION</text>

  <!-- Big Realistic Diesel Engine Graphic on Right -->
  <g transform="translate(420, 110)">
    <!-- Diesel Engine Block Base -->
    <rect x="60" y="110" width="220" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    
    <!-- Red Cylinder Head & Valve Cover -->
    <path d="M120 70 L260 70 L270 110 L110 110 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <rect x="140" y="55" width="80" height="16" rx="4" fill="#991b1b"/>
    <circle cx="160" cy="63" r="4" fill="#ffffff"/>
    <circle cx="200" cy="63" r="4" fill="#ffffff"/>
    
    <!-- Heavy Flywheel -->
    <circle cx="70" cy="185" r="75" fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="70" cy="185" r="50" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="70" cy="185" r="22" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="70" y1="110" x2="70" y2="260" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="0" y1="185" x2="140" y2="185" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Fuel Tank on Top -->
    <rect x="100" y="20" width="180" height="42" rx="8" fill="#e11d48" stroke="#be123c" stroke-width="2"/>
    <rect x="220" y="8" width="28" height="12" rx="3" fill="#facc15"/>
    <text x="140" y="46" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">KUBOTA RT</text>

    <!-- Air Filter -->
    <ellipse cx="270" cy="40" rx="18" ry="24" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- Exhaust Silencer -->
    <rect x="250" y="120" width="45" height="18" rx="4" fill="#0f172a"/>
    <path d="M295 129 L320 129 L320 80" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Radiator Front -->
    <rect x="250" y="150" width="30" height="100" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <line x1="250" y1="170" x2="280" y2="170" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="250" y1="190" x2="280" y2="190" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="250" y1="210" x2="280" y2="210" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="250" y1="230" x2="280" y2="230" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Electric Starter 12V -->
    <rect x="110" y="210" width="70" height="36" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="120" y="232" font-family="sans-serif" font-size="10" font-weight="900" fill="#78350f">12V STARTER</text>

    <!-- Throttle Lever -->
    <line x1="180" y1="120" x2="210" y2="90" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="90" r="6" fill="#ef4444"/>

    <!-- Mounting Base -->
    <rect x="50" y="260" width="240" height="14" rx="3" fill="#334155"/>
    <circle cx="70" cy="267" r="4" fill="#ffffff"/>
    <circle cx="270" cy="267" r="4" fill="#ffffff"/>
  </g>
</svg>
